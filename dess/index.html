<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>dess</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      main {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
      }

      .sighting {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 0;
        background: #000;
        cursor: pointer;
        touch-action: manipulation;
      }

      .sighting:focus-visible {
        outline: 3px solid #fff;
        outline-offset: -6px;
      }

      .sighting::before,
      .sighting::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }

      .sighting::before {
        box-shadow:
          inset 0 0 18vmin 7vmin #000,
          inset 0 0 48vmin 15vmin #000;
        transition: box-shadow 2s ease-in-out;
      }

      .sighting::after {
        background:
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.16) 0,
            rgba(0, 0, 0, 0.16) 1px,
            transparent 1px,
            transparent 3px
          );
        opacity: 0.28;
      }

      .sighting img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        user-select: none;
        -webkit-user-drag: none;
        will-change: transform, opacity;
        animation-name: distant-shot;
        animation-duration: 40s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        animation-iteration-count: infinite;
      }

      .sighting-shot-1 {
        --start-scale: 1.02;
        --end-scale: 1.42;
        --start-x: 0%;
        --start-y: 0%;
        --end-x: -3%;
        --end-y: 2%;
        object-position: 50% 22%;
      }

      .sighting-shot-2 {
        --start-scale: 1.08;
        --end-scale: 1.58;
        --start-x: 0%;
        --start-y: 0%;
        --end-x: 5%;
        --end-y: -2%;
        object-position: 50% 44%;
        animation-delay: 10s;
      }

      .sighting-shot-3 {
        --start-scale: 1.12;
        --end-scale: 1.72;
        --start-x: 0%;
        --start-y: 0%;
        --end-x: -5%;
        --end-y: -3%;
        object-position: 50% 66%;
        animation-delay: 20s;
      }

      .sighting-shot-4 {
        --start-scale: 1.16;
        --end-scale: 1.9;
        --start-x: 0%;
        --start-y: -1%;
        --end-x: 2%;
        --end-y: -7%;
        object-position: 50% 88%;
        animation-delay: 30s;
      }

      .sighting.sighted {
        cursor: default;
      }

      .sighting.sighted::before {
        box-shadow: inset 0 0 22vmin 5vmin #000;
      }

      .sighting.sighted img {
        animation-name: close-shot;
      }

      .sighting.sighted .sighting-shot-1 {
        --close-start-scale: 1.24;
        --close-end-scale: 2.05;
        --close-start-x: 0%;
        --close-start-y: 0%;
        --close-end-x: 7%;
        --close-end-y: 5%;
        object-position: 50% 28%;
      }

      .sighting.sighted .sighting-shot-2 {
        --close-start-scale: 1.34;
        --close-end-scale: 2.35;
        --close-start-x: 0%;
        --close-start-y: 0%;
        --close-end-x: -8%;
        --close-end-y: 4%;
        object-position: 50% 48%;
      }

      .sighting.sighted .sighting-shot-3 {
        --close-start-scale: 1.42;
        --close-end-scale: 2.65;
        --close-start-x: 0%;
        --close-start-y: 0%;
        --close-end-x: 5%;
        --close-end-y: -7%;
        object-position: 50% 70%;
      }

      .sighting.sighted .sighting-shot-4 {
        --close-start-scale: 1.55;
        --close-end-scale: 3;
        --close-start-x: 0%;
        --close-start-y: 0%;
        --close-end-x: -6%;
        --close-end-y: 7%;
        object-position: 50% 88%;
      }

      @keyframes distant-shot {
        0% {
          transform: scale3d(
              var(--start-scale),
              var(--start-scale),
              1
            )
            translate3d(var(--start-x), var(--start-y), 0);
          opacity: 0;
        }

        5% {
          opacity: 1;
        }

        25% {
          transform: scale3d(var(--end-scale), var(--end-scale), 1)
            translate3d(var(--end-x), var(--end-y), 0);
          opacity: 1;
        }

        30%,
        100% {
          transform: scale3d(var(--end-scale), var(--end-scale), 1)
            translate3d(var(--end-x), var(--end-y), 0);
          opacity: 0;
        }
      }

      @keyframes close-shot {
        0% {
          transform: scale3d(
              var(--close-start-scale),
              var(--close-start-scale),
              1
            )
            translate3d(var(--close-start-x), var(--close-start-y), 0);
          opacity: 0;
        }

        5% {
          opacity: 1;
        }

        25% {
          transform: scale3d(
              var(--close-end-scale),
              var(--close-end-scale),
              1
            )
            translate3d(var(--close-end-x), var(--close-end-y), 0);
          opacity: 1;
        }

        30%,
        100% {
          transform: scale3d(
              var(--close-end-scale),
              var(--close-end-scale),
              1
            )
            translate3d(var(--close-end-x), var(--close-end-y), 0);
          opacity: 0;
        }
      }

      @media (orientation: portrait) {
        .sighting-shot-1 {
          object-position: 50% 50%;
        }

        .sighting-shot-2 {
          object-position: 18% 50%;
        }

        .sighting-shot-3 {
          object-position: 82% 50%;
        }

        .sighting-shot-4 {
          object-position: 62% 50%;
        }

        .sighting.sighted .sighting-shot-1 {
          object-position: 12% 50%;
        }

        .sighting.sighted .sighting-shot-2 {
          object-position: 88% 50%;
        }

        .sighting.sighted .sighting-shot-3 {
          object-position: 36% 50%;
        }

        .sighting.sighted .sighting-shot-4 {
          object-position: 70% 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sighting img {
          animation: none !important;
          opacity: 0;
          transform: none;
        }

        .sighting .sighting-shot-1 {
          opacity: 1;
        }

        .sighting::before {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <button class="sighting" type="button" aria-label="Osserva più da vicino">
        <img
          class="sighting-shot-1"
          src="../spignatt.png"
          alt="Un ristorante vuoto"
          width="1254"
          height="1254"
          fetchpriority="high"
        />
        <img
          class="sighting-shot-2"
          src="../spignatt.png"
          alt=""
          width="1254"
          height="1254"
          aria-hidden="true"
        />
        <img
          class="sighting-shot-3"
          src="../spignatt.png"
          alt=""
          width="1254"
          height="1254"
          aria-hidden="true"
        />
        <img
          class="sighting-shot-4"
          src="../spignatt.png"
          alt=""
          width="1254"
          height="1254"
          aria-hidden="true"
        />
      </button>
      <audio
        id="sighting-audio"
        src="../assets/audio/digitalroots.mp3"
        preload="metadata"
        loop
      ></audio>
    </main>
    <script>
      const sighting = document.querySelector('.sighting');
      const sightingAudio = document.getElementById('sighting-audio');

      sightingAudio.volume = 0.5;

      sighting.addEventListener(
        'click',
        () => {
          sighting.classList.add('sighted');
          sighting.setAttribute('aria-label', 'Avvistamento');
          sightingAudio.play().catch(() => {});
        },
        { once: true },
      );
    </script>
  </body>
</html>
